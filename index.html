<!DOCTYPE html>
<html lang="ru" data-theme="hair">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Suluu Business — Управление бизнесом</title>
  
  <!-- SEO и мета-теги -->
  <meta name="description" content="Автономная система учета для салонов красоты и beauty-мастеров">
  <meta name="theme-color" content="#7c3aed">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  
  <!-- PWA поддержка -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <!-- Шрифты Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Стили приложения -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Local Tailwind CSS Build -->
  <script src="js/tailwind.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="font-sans antialiased selection:bg-indigo-500 selection:text-white bg-mesh" style="background-color: #0b0f1a; color: #ffffff;">
  
  <!-- Единственный контейнер для morphdom SPA -->
  <div id="app" class="min-h-screen">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: transparent; padding: 20px; box-sizing: border-box;">
      <div style="padding: 40px 32px; display: flex; flex-direction: column; align-items: center; gap: 20px; background: rgba(255, 255, 255, 0.96); border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); max-width: 340px; width: 100%; text-align: center; border: 1px solid rgba(255,255,255,0.2); animation: fadeIn 0.3s ease-out;">
        <div style="font-size: 48px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15)); animation: pulse 1.5s infinite;">💎</div>
        
        <div>
          <h2 style="font-weight: 800; font-size: 22px; color: #1a1a2e; margin-bottom: 4px; letter-spacing: -0.02em;">Suluu Business</h2>
          <p style="font-size: 12px; color: #555; line-height: 1.4; font-weight: 500;">Современная платформа для управления салоном красоты</p>
        </div>
        
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 8px 0;">
          <span style="width: 36px; height: 36px; border: 3.5px solid #e2e8f0; border-top-color: #764ba2; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block;"></span>
          <div style="font-weight: 700; color: #764ba2; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase;">Инициализация...</div>
        </div>
        
        <div style="border-top: 1px solid #e2e8f0; padding-top: 12px; width: 100%; font-size: 10px; color: #999; display: flex; flex-direction: column; gap: 2px;">
          <div>Версия: <span style="font-weight: 600; color: #666;">2.3.0-PRO</span></div>
          <div>Обновление: <span style="font-weight: 600; color: #666;">31.05.2026</span></div>
        </div>
      </div>
    </div>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.95); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>

  <noscript>
    <div style="padding: 40px; text-align: center; font-family: sans-serif;">
      <h2>Для работы Suluu Business требуется включенный JavaScript!</h2>
      <p>Пожалуйста, включите JavaScript в настройках вашего браузера.</p>
    </div>
  </noscript>

  <!-- Скрипт-регистратор Service Worker для PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker успешно зарегистрирован!', reg.scope))
          .catch((err) => console.log('Ошибка регистрации Service Worker:', err));
      });
    }
  </script>

  <!-- Сторонние библиотеки (локально и CDN) -->
  <script src="js/morphdom.min.js"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- JS Модули приложения -->
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/core/engine.js"></script>
  <script src="js/core/router.js"></script>
  
  <!-- Страницы-компоненты -->
  <script src="js/pages/auth.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/bookings.js"></script>
  <script src="js/pages/masters.js"></script>
  <script src="js/pages/clients.js"></script>
  <script src="js/pages/services.js"></script>
  <script src="js/pages/finance.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/job_search.js"></script>
  <script src="js/pages/super_admin_panel.js"></script>
  
  <!-- Точка входа в приложение (всегда в самом конце) -->
  <script src="js/app.js"></script>
</body>
</html>
